<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>You're Confirmed — Gwyneth's Debut</title>

<!-- Bootstrap (CDN) -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Fonts (matches the RSVP + Debut Feature pages) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500;1,600&family=Jost:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,500;0,700;0,900;1,600&display=swap" rel="stylesheet">

<!-- QR code generation, client-side, from the guest's token -->
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>

<style>
  :root{
    --ink:#0b0b0c;
    --ivory:#f6f1e9;
    --ivory-soft:#eee7da;
    --gold:#8ba38d;
    --gold-soft:#aebfa0;
    --rose:#c98ca0;
    --rose-soft:#e3bcc7;
    --line-on-light:rgba(11,11,12,.12);
    --ff-display:'Playfair Display', serif;
    --ff-body:'Jost', sans-serif;
    --ff-accent:'Cormorant Garamond', serif;
  }

  *{ box-sizing:border-box; }
  html{ max-width:100%; overflow-x:hidden; }

  body{
    margin:0;
    min-height:100svh;
    background:
      radial-gradient(ellipse at 50% 10%, rgba(139,163,141,.14), transparent 60%),
      var(--ink);
    color:var(--ivory);
    font-family:var(--ff-body);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:6vh 1.25rem;
    overflow-x:hidden;
  }

  .confirm-card{
    width:100%;
    max-width:460px;
    background:var(--ivory);
    color:var(--ink);
    border-radius:28px;
    padding:clamp(1.8rem, 5vw, 3rem);
    text-align:center;
    box-shadow:0 40px 80px -30px rgba(0,0,0,.55);
    opacity:0;
    transform:translateY(24px);
    transition:opacity .9s cubic-bezier(.22,1,.36,1), transform .9s cubic-bezier(.22,1,.36,1);
  }
  .confirm-card.in-view{ opacity:1; transform:translateY(0); }

  .check-badge{
    width:56px; height:56px;
    margin:0 auto 1.2rem;
    border-radius:50%;
    background:linear-gradient(135deg, var(--gold-soft), var(--gold));
    display:flex; align-items:center; justify-content:center;
    color:#fff; font-size:1.6rem;
  }

  .eyebrow{
    font-family:var(--ff-accent);
    font-style:italic;
    font-weight:500;
    letter-spacing:.3em;
    text-transform:uppercase;
    font-size:.72rem;
    color:var(--rose);
  }

  h1{
    font-family:var(--ff-display);
    font-style:italic;
    font-weight:700;
    font-size:clamp(1.5rem, 5vw, 2rem);
    margin:.6rem 0 0;
  }

  .guest-name{
    font-weight:500;
    color:var(--rose);
  }

  .instructions{
    font-size:.98rem;
    line-height:1.75;
    color:rgba(11,11,12,.72);
    max-width:360px;
    margin:.9rem auto 0;
  }

  .qr-wrap{
    margin:2rem auto 0;
    display:inline-block;
    background:#fff;
    padding:16px;
    border-radius:18px;
    border:1.5px solid var(--line-on-light);
  }
  .qr-wrap canvas{ display:block; width:220px; height:220px; }

  .qr-loading, .qr-error{
    width:220px; height:220px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:.85rem;
    color:rgba(11,11,12,.5);
    text-align:center;
    padding:1rem;
  }
  .qr-error{ color:#b3435a; display:none; }

  .guest-meta{
    margin-top:1.2rem;
    font-size:.86rem;
    color:rgba(11,11,12,.55);
  }

  .download-btn{
    display:inline-block;
    margin-top:1.6rem;
    padding:.85rem 1.8rem;
    font-family:var(--ff-body);
    font-weight:500;
    letter-spacing:.08em;
    text-transform:uppercase;
    font-size:.82rem;
    color:var(--ink);
    background:#fff;
    border:1.5px solid var(--line-on-light);
    border-radius:12px;
    text-decoration:none;
    cursor:pointer;
    transition:border-color .25s ease, background .25s ease;
  }
  .download-btn:hover{ border-color:var(--rose); background:var(--ivory-soft); }

  .hairline{
    width:90px;
    height:2px;
    background:linear-gradient(90deg, transparent, var(--gold), transparent);
    margin:1.8rem auto 1.4rem;
  }

  .back-link{
    display:block;
    margin-top:1.6rem;
    font-family:var(--ff-accent);
    font-style:italic;
    font-size:.88rem;
    color:rgba(11,11,12,.5);
    text-decoration:none;
    border-bottom:1px solid transparent;
    transition:border-color .3s ease;
  }
  .back-link:hover{ border-color:rgba(11,11,12,.3); }

  .no-token{
    display:none;
  }

  @media (max-width:420px){
    .qr-wrap canvas, .qr-loading, .qr-error{ width:180px; height:180px; }
  }
</style>
</head>
<body>

  <div class="confirm-card" id="confirmCard">
    <div class="check-badge">✓</div>
    <p class="eyebrow">Attendance Confirmed</p>
    <h1>Thank you for confirming<span id="guestNameWrap">, <span class="guest-name" id="guestName"></span></span>!</h1>

    <p class="instructions">
      Please save this QR code, as it will be scanned before you enter the venue.
    </p>

    <div class="hairline"></div>

    <div class="qr-wrap" id="qrWrap">
      <div class="qr-loading" id="qrLoading">Generating your QR code…</div>
      <div class="qr-error" id="qrError">Couldn't load your QR code. Please refresh this page.</div>
      <canvas id="qrCanvas" style="display:none;"></canvas>
    </div>

    <p class="guest-meta" id="guestMeta"></p>

    <div>
      <button class="download-btn" id="downloadBtn" type="button" style="display:none;">Download QR Code</button>
    </div>

    <a class="back-link" href="rsvp.html">Back to RSVP form</a>
  </div>

<script>
(function(){
  var params = new URLSearchParams(window.location.search);
  var token = params.get('token');
  var name = params.get('name');

  var card = document.getElementById('confirmCard');
  var guestNameWrap = document.getElementById('guestNameWrap');
  var guestNameEl = document.getElementById('guestName');
  var guestMeta = document.getElementById('guestMeta');
  var qrLoading = document.getElementById('qrLoading');
  var qrError = document.getElementById('qrError');
  var qrCanvas = document.getElementById('qrCanvas');
  var downloadBtn = document.getElementById('downloadBtn');

  requestAnimationFrame(function(){ card.classList.add('in-view'); });

  if(name){
    guestNameEl.textContent = name;
  } else {
    guestNameWrap.style.display = 'none';
  }

  if(!token){
    qrLoading.style.display = 'none';
    qrError.textContent = 'No QR code found for this link. Please RSVP again to receive your pass.';
    qrError.style.display = 'flex';
  } else {
    // The QR encodes the guest's unique token — this is what door staff scan
    // via the /api/checkin endpoint on the night of the event.
    QRCode.toCanvas(qrCanvas, token, { width: 220, margin: 1, color: { dark: '#0b0b0c', light: '#ffffff' } }, function(err){
      if(err){
        qrLoading.style.display = 'none';
        qrError.style.display = 'flex';
        return;
      }
      qrLoading.style.display = 'none';
      qrCanvas.style.display = 'block';
      downloadBtn.style.display = 'inline-block';
    });

    downloadBtn.addEventListener('click', function(){
      var link = document.createElement('a');
      link.download = 'gwyneth-debut-rsvp-qr.png';
      link.href = qrCanvas.toDataURL('image/png');
      link.click();
    });

    // Optional: confirm against the server that this token is really on file,
    // and show the guest count that was recorded.
    fetch('/api/rsvp/' + encodeURIComponent(token))
      .then(function(res){ return res.ok ? res.json() : null; })
      .then(function(data){
        if(data && data.guestsCount){
          guestMeta.textContent = 'Party of ' + data.guestsCount + (data.guestsCount > 1 ? ' guests' : ' guest');
        }
      })
      .catch(function(){ /* non-critical; page still works from URL params alone */ });
  }
})();
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
